[project]
name = "svc-c2-016"
version = "0.1.0"
description = "Field Service Dispatch & Work Order Orchestration Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repo arm — a local stub package on PYTHONPATH for stub-era
# repos, or installed from the package registry for wheel-era repos (see the
# dual-mode test job in the CI configuration). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# The installed agenticstar-agentcore wheel ships no PEP 561 py.typed marker, so
# strict mode can't see into framework.*/shared.* at all: every import is
# import-untyped, which cascades into "Class cannot subclass ... (has type Any)"
# for every node/graph that inherits from a framework base class. Both gaps are
# upstream SDK gaps, not local errors — silence them here rather than disabling
# strict mode wholesale.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.*"
disallow_subclassing_any = false
